version: '3.8'

services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception

  wordpress:
    build:
      context: ./requirements/wordpress
    container_name: wordpress
    env_file:
      - .env
    depends_on:
      - mariadb
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html

  nginx:
    build:
      context: ./requirements/nginx
      args:
        DOMAIN_NAME: ${DOMAIN_NAME}
    container_name: nginx
    env_file:
      - .env
    depends_on:
      - wordpress
      - mailhog
      - portfolio
    ports:
      - "443:443"
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    restart: unless-stopped

  redis:
    build: ./requirements/bonus/redis
    container_name: redis
    env_file:
      - .env
    depends_on:
      - wordpress
    ports:
      - "6379:6379"
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    restart: unless-stopped

  ftp:
    build: ./requirements/bonus/ftp
    container_name: ftp
    env_file:
      - .env
    depends_on:
      - wordpress
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    restart: unless-stopped

  adminer:
    build: ./requirements/bonus/Adminer
    container_name: adminer
    env_file:
      - .env
    depends_on:
      - mariadb
    networks:
      - inception
    restart: unless-stopped

  mailhog:
    build: ./requirements/bonus/mailhog
    container_name: mailhog
    # ports:
    #   - "8025:8025"  # Interface web MailHog
    networks:
      - inception
    restart: unless-stopped

  portfolio:
    build: ./requirements/bonus/portfolio
    container_name: portfolio
    env_file:
      - .env
    depends_on:
      - mailhog
    networks:
      - inception
    restart: unless-stopped

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress

networks:
  inception:
    driver: bridge
