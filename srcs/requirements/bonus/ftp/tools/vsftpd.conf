# Configuration vsftpd pour serveur FTP sécurisé

# Activer les connexions anonymes (désactivé pour la sécurité)
anonymous_enable=NO

# Autoriser les utilisateurs locaux
local_enable=YES

# Autoriser l'écriture
write_enable=YES

# Masque de création des fichiers
local_umask=022

# Messages de répertoire
dirmessage_enable=YES

# Activer la journalisation des transferts
xferlog_enable=YES
xferlog_std_format=YES
xferlog_file=/var/log/vsftpd.log

# Port de connexion pour FTP actif
connect_from_port_20=YES

# Configuration du mode passif
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110

# Utilisateurs chrootés dans leur répertoire home
chroot_local_user=YES
allow_writeable_chroot=YES

# Répertoire racine pour tous les utilisateurs FTP
local_root=/var/www/html

# Bannière de bienvenue
ftpd_banner=Bienvenue sur le serveur FTP Inception!

# Configuration des connexions
listen=YES
listen_ipv6=NO

# Sécurité
seccomp_sandbox=NO

# Activer les utilisateurs virtuels si nécessaire
guest_enable=NO

# Configuration du port standard FTP
listen_port=21

# Timeout configurations
idle_session_timeout=300
data_connection_timeout=300

# Configuration SSL/TLS (optionnel, pour plus de sécurité)
ssl_enable=NO

# Logs détaillés
log_ftp_protocol=YES
dual_log_enable=YES

# Répertoire de travail
secure_chroot_dir=/var/run/vsftpd/empty